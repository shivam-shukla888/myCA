name: CI/CD Quality Gate & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Build, Lints & Security Suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npm run build

      - name: Run Core API & Auth Suite
        run: npx tsx tests/api.test.ts
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ENCRYPTION_SECRET_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Run AI Layer Safety & Grounding Suite
        run: npx tsx tests/ai.test.ts
        env:
          NODE_ENV: test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENCRYPTION_SECRET_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Run Performance & Idempotency Suite
        run: npx tsx tests/step7_performance.test.ts
        env:
          NODE_ENV: test
          ENCRYPTION_SECRET_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

      - name: Run Hardened Security Audit Suite
        run: npx tsx tests/step8_security.test.ts
        env:
          NODE_ENV: test
          ENCRYPTION_SECRET_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

  frontend-quality-gate:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.personal-ca.example.com/api/v1
          NEXT_PUBLIC_SUPABASE_URL: https://pesvgxqpdeeyhjvqoaip.supabase.co
